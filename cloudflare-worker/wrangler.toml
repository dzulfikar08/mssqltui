name = "mssqltui-downloads"
main = "worker.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "production"

[[routes]]
pattern = "dl-mssqltui.voltrus.id"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "mssqltui-releases-db"
database_id = "ba39362e-9540-43a9-aa4a-4a98ff919c2f"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mssqltui-releases"
