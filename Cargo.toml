[package]
name = "mssqltui"
version = "0.2.0"
edition = "2021"
authors = ["Dzulfikar Ats Tsauri <dzulfikar08@github.com>"]
license = "GPL-3.0"
description = "A blazing fast TUI MSSQL browser — browse, query, and manage databases from your terminal"
repository = "https://github.com/dzulfikar08/mssqltui"
readme = "README.md"
keywords = ["cli", "tui", "mssql", "sql-server", "database"]
categories = ["command-line-utilities"]

[dependencies]
arboard = { version = "3.4.1", features = ["wayland-data-control"] }
axum = "0.7"
clap = { version = "4.5.27", features = ["derive"] }
color-eyre = "0.6.3"
crossterm = "0.28.1"
ratatui = { version = "0.29.0", features = ["serde"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = "0.26.3"
tiberius = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
mime_guess = "2"
