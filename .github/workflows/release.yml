name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: mssqltui-aarch64-macos
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: mssqltui-x86_64-macos
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: mssqltui-x86_64-linux
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: mssqltui-aarch64-linux

    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$crate_version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v$crate_version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libx11-dev libxkbcommon-dev

      - name: Build web UI
        run: cd web && npm ci && npm run build

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name binary
        run: |
          cp target/${{ matrix.target }}/release/mssqltui ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Smoke test (native targets)
        if: matrix.target != 'x86_64-apple-darwin'
        run: ./${{ matrix.artifact }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          chmod +x mssqltui-*
          test "$(ls mssqltui-* | wc -l)" -eq 4
          sha256sum mssqltui-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
